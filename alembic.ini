# Configuración de Alembic para Projecta PMO Intelligence.
#
# La URL de la base de datos NO se escribe aquí: `alembic/env.py` la toma de
# `app.core.config.settings` (propiedad `database_url_sync`, que traduce
# `postgresql+asyncpg` a `postgresql+psycopg`).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# La URL se define en tiempo de ejecución desde la configuración de la app.
sqlalchemy.url =

# Otros opciones del motor (pool, connect_args…) se pueden añadir aquí.
# sqlalchemy.connect_args = {"timeout": 10}

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
